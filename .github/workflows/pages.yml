# Builds the web version of the game with Godot and publishes it on GitHub Pages.
# Runs on every push to main (and by hand from the Actions tab). One-time setup: in the repository's
# Settings > Pages, set "Source" to "GitHub Actions". See README.md, "Play it in a browser".
name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Must match the Godot version the project is developed with (godot --version), e.g. 4.7.2.
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and its export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/bin"
          unzip -q godot.zip -d godot_bin
          mv "godot_bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/bin/godot"
          chmod +x "$HOME/bin/godot"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$dest/"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: "Import the project twice (the second pass registers the script class names)"
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import || true

      - name: Export the Web preset
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
